playbook_name: "cis_1_6_4"
backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
req_01: "Apply prerequisite check for crypto-policies tools using command: `command -v update-crypto-policies && command -v reboot`. Expected result: both commands return paths without error."
req_02: |
  Create or edit the subpolicy file /etc/crypto-policies/policies/modules/NO-WEAKMAC.pmod with content disabling weak MACs using command: `printf '%s\\n' '# This is a subpolicy to disable weak macs' 'mac = -*-64' >> /etc/crypto-policies/policies/modules/NO-WEAKMAC.pmod`. Expected result: file is created or appended with the specified lines.
req_03: "Apply the system-wide crypto policy with the NO-WEAKMAC subpolicy using command: `update-crypto-policies --set DEFAULT:NO-WEAKMAC`. Expected result: command completes successfully and updates the system crypto policy."
req_04: "Reboot the system to make cryptographic settings effective for running services using command: `reboot`. Expected result: system reboots successfully."
req_05: "Verify that MACs less than 128 bits are disabled in the active crypto policy using command: `update-crypto-policies --show`. Expected result: output includes 'DEFAULT:NO-WEAKMAC' or equivalent showing the subpolicy is applied."
req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
