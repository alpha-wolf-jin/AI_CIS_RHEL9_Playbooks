---
- name: Initialize meta data variables
  include_vars: cis_remediation_var_1_1_1_1.yml

- name: "State Guard - Remove stale checkpoint"
  ansible.builtin.file:
    path: "{{ state_guard_dir }}"
    state: absent
  tags: [snapshot]
- name: "State Guard - Create checkpoint directory"
  ansible.builtin.file:
    path: "{{ state_guard_dir }}"
    state: directory
    mode: '0700'
  tags: [snapshot]
- name: "State Guard - Check if cramfs modprobe config exists"
  ansible.builtin.stat:
    path: "{{ config_file }}"
  register: _sg_config_stat
  tags: [snapshot]
- name: "State Guard - Backup cramfs modprobe config (present)"
  ansible.builtin.copy:
    src: "{{ config_file }}"
    dest: "{{ state_guard_dir }}/cramfs.conf.present"
    remote_src: true
  when: _sg_config_stat.stat.exists
  tags: [snapshot]
- name: "State Guard - Mark cramfs modprobe config as absent"
  ansible.builtin.copy:
    content: "absent"
    dest: "{{ state_guard_dir }}/cramfs.conf.absent"
  when: not _sg_config_stat.stat.exists
  tags: [snapshot]

- block:
  - name: "Req step-02 - Deploy remediation script for cramfs module"
    ansible.builtin.copy:
      dest: "{{ _script_path }}"
      mode: '0700'
      content: |
        l_mod_name="{{ kernel_module_name }}"
        l_mod_type="fs"
        {% raw %}
        l_mod_path="$(readlink -f /lib/modules/**/kernel/$l_mod_type | sort -u)"
        f_module_fix()
        {
           l_dl="y"
           a_showconfig=()
           while IFS= read -r l_showconfig; do
              a_showconfig+=("$l_showconfig")
           done < <(modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+'"${l_mod_name//-/_}"'\b')
           if  lsmod | grep "$l_mod_name" &> /dev/null; then
              a_output2+=(" - unloading kernel module: \"$l_mod_name\"")
              modprobe -r "$l_mod_name" 2>/dev/null; rmmod "$l_mod_name" 2>/dev/null
           fi
           if ! grep -Pq -- '\binstall\h+'"${l_mod_name//- /_}"'\h+\/bin\/(true|false)\b' <<< "${a_showconfig[*]}"; then
              a_output2+=(" - setting kernel  module: \"$l_mod_name\" to \"/bin/false\"")
              printf '%s\n' "install $l_mod_name /bin/false" >> /etc/modprobe.d/"$l_mod_name".conf
           fi
           if ! grep -Pq -- '\bblacklist\h+'"${l_mod_name//-/_}"'\b' <<< "${a_showconfig[*]}"; then
              a_output2+=(" - denylisting kernel  module: \"$l_mod_name\"")
              printf '%s\n' "blacklist $l_mod_name" >> /etc/modprobe.d/"$l_mod_name".conf
           fi
        }
        for l_mod_base_directory in $l_mod_path; do
           if [ -d "$l_mod_base_directory/${l_mod_name/-/\/}" ] && [ -n "$(ls -A $l_mod_base_directory/${l_mod_name/-/\/})" ]; then
              l_output3="$l_output3\n  - \"$l_mod_base_directory\""
              [[ "$l_mod_name" =~ overlay ]] && l_mod_name="${l_mod_name::-2}"
              [ "$l_dl" != "y" ] && f_module_fix
           else
              echo -e " - kernel module: \"$l_mod_name\" doesn't exist in \"$l_mod_base_directory\""
           fi
        done
        [ -n "$l_output3" ] && echo -e "\n\n -- INFO --\n - module: \"$l_mod_name\" exists in:$l_output3"
        [ "${#a_output2[@]}" -gt 0 ] && printf '%s\n' "${a_output2[@]}"
        echo -e "\n - remediation of kernel module: \"$l_mod_name\" complete\n"
        {% endraw %}
    tags: [execute]

  - name: "Req step-02 - Execute remediation script"
    ansible.builtin.shell: /bin/bash "{{ _script_path }}"
    args:
      executable: /bin/bash
    register: _remediate_result
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-02 - Store remediation script details"
    ansible.builtin.set_fact:
      _rem_task_02_name: "Execute remediation script"
      _rem_command_02: "/bin/bash {{ _script_path }}"
      _rem_rc_02: "{{ _remediate_result.rc | default(-1) }}"
      _rem_data_02: "{{ _remediate_result.stdout | default('') | trim }}"
      _rem_status_02: "{{ ('PASS' if (_remediate_result.rc | default(-1) == 0) else 'FAIL') | trim }}"
      _rem_details_02: "{{ ('Script executed successfully' if (_remediate_result.rc | default(-1) == 0) else 'Script execution failed') | trim }}"
    tags: [execute]

  - name: "Req step-03 - Run CIS audit tasks to verify compliance"
    ansible.builtin.include_tasks:
      file: "{{ audit_tasks_file }}"
    tags: [execute]

  - name: "Req step-03 - Abort if audit task reports unexpected result"
    ansible.builtin.fail:
      msg: "Audit task {{ audit_tasks_file }} reported '{{ cis_result }}' after remediation. Ensure the audit playbook works correctly and the fix has been applied before re-running remediation."
    when: cis_result not in ['PASS', 'SKIP']
    tags: [execute]

  - name: "Req step-04 - Store final remediation result in cis_result"
    ansible.builtin.set_fact:
      cis_result: "{{ cis_result | default('ERROR') }}"
    tags: [execute]

  - name: "Generate remediation report"
    ansible.builtin.debug:
      msg:
      - "REMEDIATION REPORT — CIS 1.1.1.1"
      - "Reference: CIS Benchmark checkpoint 1.1.1.1"
      - ""
      - "REQUIREMENT 02 - {{ _rem_req_02 }}:"
      - "  Task: {{ _rem_task_02_name | default('Not recorded') }}"
      - "  Command: {{ _rem_command_02 | default('N/A') }}"
      - "  Exit code: {{ _rem_rc_02 | default(-1) }}"
      - "  Data: {{ _rem_data_02 | default('') | trim }}"
      - "  Status: {{ _rem_status_02 | default('ERROR') | trim }}"
      - "  Details: {{ _rem_details_02 | default('') | trim }}"
      - ""
      - "REQUIREMENT 03 - {{ _rem_req_03 }}:"
      - "  Task: Run CIS audit tasks "
      - "  Command: include_tasks: {{ audit_tasks_file }}"
      - "  Exit code: N/A"
      - "  Data: N/A"
      - "  Status: {{ cis_result | default('ERROR') | trim }}"
      - "  Details: Verification via CIS audit"
      - ""
      - "REQUIREMENT 04 - {{ _rem_req_04 }}:"
      - "  Task: Store cis_result"
      - "  Command: set_fact: cis_result={{ cis_result | default('ERROR') | trim }}"
      - "  Exit code: N/A"
      - "  Data: N/A"
      - "  Status: {{ cis_result | default('ERROR') | trim }}"
      - "  Details: Overall remediation result stored"
      - ""
      - "========================================================"
      - "OVERALL REMEDIATION:"
      - "  Result: {{ cis_result | default('ERROR') | trim }}"
      - "========================================================"
    tags: [execute]

  always:
  - name: "State Guard Restore - Check if checkpoint exists"
    ansible.builtin.stat:
      path: "{{ state_guard_flag }}"
    register: _sg_restore_flag
    failed_when: false
    tags: [restore]

  - name: "State Guard Restore - Check for cramfs conf backup"
    ansible.builtin.stat:
      path: "{{ state_guard_dir }}/cramfs.conf.present"
    register: _sg_restore_present
    failed_when: false
    tags: [restore]

  - name: "State Guard Restore - Restore cramfs conf from backup"
    ansible.builtin.copy:
      src: "{{ state_guard_dir }}/cramfs.conf.present"
      dest: "{{ config_file }}"
      remote_src: true
    when: _sg_restore_present.stat.exists | default(false)
    failed_when: false
    tags: [restore]

  - name: "State Guard Restore - Check for cramfs conf absent marker"
    ansible.builtin.stat:
      path: "{{ state_guard_dir }}/cramfs.conf.absent"
    register: _sg_restore_absent
    failed_when: false
    tags: [restore]

  - name: "State Guard Restore - Delete cramfs conf if it was absent"
    ansible.builtin.file:
      path: "{{ config_file }}"
      state: absent
    when: _sg_restore_absent.stat.exists | default(false)
    failed_when: false
    tags: [restore]

  - name: "State Guard Restore - Remove checkpoint"
    ansible.builtin.file:
      path: "{{ state_guard_dir }}"
      state: absent
    when: _sg_restore_flag.stat.exists | default(false)
    failed_when: false
    tags: [restore]
