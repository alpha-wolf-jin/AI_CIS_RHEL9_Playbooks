playbook_name: "cis_1_1_2_remediation"
backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
secpol_cfg_path: "C:/secpol.cfg"
verify_cfg_path: "C:/verify.cfg"
max_password_age_days: "180"

req_01: "Detect server role using command: `(Get-WmiObject Win32_ComputerSystem).DomainRole`. Expected result: 4 or 5 for Domain Controller, 1-3 for Member Server."
req_02: "If Domain Controller, apply maximum password age to {{ max_password_age_days }} days using command: `Set-ADDefaultDomainPasswordPolicy -Identity (Get-ADDomain).DistinguishedName -MaxPasswordAge (New-TimeSpan -Days {{ max_password_age_days }})`. Expected result: policy updated."
req_03: "If Domain Controller, verify maximum password age using command: `Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty MaxPasswordAge`. Expected result: {{ max_password_age_days }} days."
req_04: |-
  If Member Server, export current security policy using command: `secedit /export /cfg C:\\secpol.cfg /areas SECURITYPOLICY`. Expected result: configuration file created.
req_05: |-
  If Member Server, edit C:\\secpol.cfg to set 'MaximumPasswordAge = {{ max_password_age_days }}' using command: `(Get-Content C:\\secpol.cfg) -replace 'MaximumPasswordAge = \\d+', 'MaximumPasswordAge = {{ max_password_age_days }}' | Set-Content C:\\secpol.cfg`. Expected result: file updated.
req_06: |-
  If Member Server, apply modified security policy using command: `secedit /configure /db C:\\Windows\\security\\local.sdb /cfg C:\\secpol.cfg /areas SECURITYPOLICY /quiet`. Expected result: policy applied.
req_07: |-
  If Member Server, verify maximum password age using command: `secedit /export /cfg C:\\verify.cfg /areas SECURITYPOLICY; Select-String -Path C:\\verify.cfg -Pattern 'MaximumPasswordAge'`. Expected result: MaximumPasswordAge = {{ max_password_age_days }}.
req_08: |-
  Clean up temporary files using command: `Remove-Item C:\\secpol.cfg, C:\\verify.cfg -ErrorAction SilentlyContinue`. Expected result: files removed.
req_09: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_10: "Create a task named 'Generate remediation report' using debug msg with required format."
