---
- name: Initialize meta data variables
  include_vars: cis_remediation_var_5_1_4.yml

- name: "Snapshot - Remove stale checkpoint if exists"
  ansible.builtin.file:
    path: "{{ state_guard_dir }}"
    state: absent
  tags: [snapshot]
- name: "Snapshot - Create checkpoint directory"
  ansible.builtin.file:
    path: "{{ state_guard_dir }}"
    state: directory
    mode: "0700"
  tags: [snapshot]
- name: "Snapshot - Check if NO-SSHWEAKCIPHERS.pmod exists"
  ansible.builtin.stat:
    path: "/etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod"
  register: _sg_pmod_stat
  tags: [snapshot]
- name: "Snapshot - Backup pmod file if exists"
  ansible.builtin.copy:
    src: "/etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod"
    dest: "{{ state_guard_dir }}/NO-SSHWEAKCIPHERS.pmod.present"
    remote_src: true
  when: _sg_pmod_stat.stat.exists
  tags: [snapshot]
- name: "Snapshot - Mark pmod file as absent if not exists"
  ansible.builtin.copy:
    content: "absent"
    dest: "{{ state_guard_dir }}/NO-SSHWEAKCIPHERS.pmod.absent"
  when: not _sg_pmod_stat.stat.exists
  tags: [snapshot]
- name: "Snapshot - Capture current crypto policy"
  ansible.builtin.shell: update-crypto-policies --show
  args:
    executable: /bin/bash
  register: _sg_current_policy
  failed_when: false
  changed_when: false
  tags: [snapshot]
- name: "Snapshot - Save current policy to file"
  ansible.builtin.copy:
    content: "{{ _sg_current_policy.stdout | default('') }}"
    dest: "{{ state_guard_dir }}/current_policy.state"
  when: _sg_current_policy.stdout | default('') | length > 0
  tags: [snapshot]
- name: "Snapshot - List files in crypto policy modules directory"
  ansible.builtin.shell: find /etc/crypto-policies/policies/modules/ -maxdepth 1 -type f -printf '%f\n'
  args:
    executable: /bin/bash
  register: _sg_modules_files
  changed_when: false
  tags: [snapshot]
- name: "Snapshot - Save module file list"
  ansible.builtin.copy:
    content: "{{ _sg_modules_files.stdout | default('') }}"
    dest: "{{ state_guard_dir }}/modules_filelist.txt"
  when: _sg_modules_files.stdout | default('') | length > 0
  tags: [snapshot]
- name: "Snapshot - Create checkpoint flag"
  ansible.builtin.copy:
    content: "checkpoint"
    dest: "{{ state_guard_flag }}"
  tags: [snapshot]

- block:
  - name: "Initialize data variables"
    ansible.builtin.set_fact:
      data_01: "Not collected yet"
      status_01: "ERROR"
      details_01: "Not evaluated"
      data_02: "Not collected yet"
      status_02: "ERROR"
      details_02: "Not evaluated"
      data_03: "Not collected yet"
      status_03: "ERROR"
      details_03: "Not evaluated"
      data_04: "Not collected yet"
      status_04: "ERROR"
      details_04: "Not evaluated"
      data_05: "Not collected yet"
      status_05: "ERROR"
      details_05: "Not evaluated"
      data_09: "Not collected yet"
      status_09: "ERROR"
      details_09: "Not evaluated"
      task_01_name: "Not executed"
      task_01_cmd: "N/A"
      task_01_rc: -1
      task_02_name: "Not executed"
      task_02_cmd: "N/A"
      task_02_rc: -1
      task_03_name: "Not executed"
      task_03_cmd: "N/A"
      task_03_rc: -1
      task_04_name: "Not executed"
      task_04_cmd: "N/A"
      task_04_rc: -1
      task_05_name: "Not executed"
      task_05_cmd: "N/A"
      task_05_rc: -1
      task_09_name: "Not executed"
      task_09_cmd: "N/A"
      task_09_rc: -1
    tags: [execute]

# Requirement 9 - Check sshd installed
  - name: "Req step-09 - Check sshd installed"
    ansible.builtin.shell: rpm -q openssh-server
    args:
      executable: /bin/bash
    register: result_09
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-09 - Store sshd prerequisite details"
    ansible.builtin.set_fact:
      task_09_name: "Check sshd installed"
      task_09_cmd: "rpm -q openssh-server"
      task_09_rc: "{{ result_09.rc | default(-1) }}"
      data_09: "{{ result_09.stdout | default('') | trim }}"
      status_09: "{{ 'PASS' if result_09.rc == 0 else 'SKIP' }}"
      details_09: "{{ 'sshd installed' if result_09.rc == 0 else 'sshd not installed - remediation cannot proceed' }}"
      _sshd_installed: "{{ result_09.rc == 0 }}"
    tags: [execute]

# Requirement 1 - Package prerequisite
  - name: "Req step-01 - Check crypto-policies-scripts package"
    ansible.builtin.shell: rpm -q crypto-policies-scripts
    args:
      executable: /bin/bash
    register: _step01_output
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-01 - Store package prerequisite details"
    ansible.builtin.set_fact:
      task_01_name: "Check crypto-policies-scripts package"
      task_01_cmd: "rpm -q crypto-policies-scripts"
      task_01_rc: "{{ _step01_output.rc | default(-1) }}"
      data_01: "{{ _step01_output.stdout | default('') | trim }}"
      status_01: "{{ 'PASS' if _step01_output.rc == 0 else 'SKIP' }}"
      details_01: "{{ 'Package installed' if _step01_output.rc == 0 else 'Package not installed - remediation cannot proceed' }}"
      _package_installed: "{{ _step01_output.rc == 0 }}"
    tags: [execute]

# Requirement 2 - Create weak cipher policy module
  - name: "Req step-02 - Create weak cipher policy module"
    ansible.builtin.shell: |
      if [ -f /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod ] && grep -q 'cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305' /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod 2>/dev/null; then
        echo "ALREADY_PRESENT"
      else
        mkdir -p /etc/crypto-policies/policies/modules
        printf '%s\n' "# This is a subpolicy to disable weak ciphers" "# for the SSH protocol (libssh and OpenSSH)" "cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305" >> /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod
        echo "CREATED_OR_MODIFIED"
      fi
    args:
      executable: /bin/bash
    register: _step02_output
    failed_when: false
    changed_when: false
    when: (_package_installed | default(false) | bool) and (_sshd_installed | default(false) | bool)
    tags: [execute]

  - name: "Req step-02 - Store policy module creation details"
    ansible.builtin.set_fact:
      task_02_name: "Create crypto policy module for weak SSH ciphers"
      task_02_cmd: "printf ... >> NO-SSHWEAKCIPHERS.pmod (with existence check)"
      task_02_rc: "{{ _step02_output.rc | default(-1) }}"
      data_02: "{{ _step02_output.stdout | default('') | trim }}"
      status_02: "{{ 'PASS' if _step02_output.stdout | default('') is search('ALREADY_PRESENT|CREATED_OR_MODIFIED') else 'FAIL' }}"
      details_02: "{{ 'File already contained required content' if ('ALREADY_PRESENT' in _step02_output.stdout) else ('Created/updated file' if ('CREATED_OR_MODIFIED' in _step02_output.stdout) else 'Failed to ensure module file') }}"
    when: (_package_installed | default(false) | bool) and (_sshd_installed | default(false) | bool)
    tags: [execute]

# Requirement 3 - Update system-wide crypto policy
  - name: "Req step-03 - Update system-wide cryptographic policy"
    ansible.builtin.shell: update-crypto-policies --set DEFAULT:NO-SHA1:NO-WEAKMAC:NO-SSHCBC:NO-SSHCHACHA20:NO-SSHWEAKCIPHERS
    args:
      executable: /bin/bash
    register: _step03_output
    failed_when: false
    when: (_package_installed | default(false) | bool) and (_sshd_installed | default(false) | bool)
    tags: [execute]

  - name: "Req step-03 - Store policy update details"
    ansible.builtin.set_fact:
      task_03_name: "Update system crypto policy"
      task_03_cmd: "update-crypto-policies --set DEFAULT:NO-SHA1:NO-WEAKMAC:NO-SSHCBC:NO-SSHCHACHA20:NO-SSHWEAKCIPHERS"
      task_03_rc: "{{ _step03_output.rc | default(-1) }}"
      data_03: "{{ _step03_output.stdout | default('') | trim }}"
      status_03: "{{ 'PASS' if _step03_output.rc == 0 else 'FAIL' }}"
      details_03: "{{ 'Policy updated successfully' if _step03_output.rc == 0 else 'Policy update command failed' }}"
    when: (_package_installed | default(false) | bool) and (_sshd_installed | default(false) | bool)
    tags: [execute]

# Requirement 4 - Reload sshd
  - name: "Req step-04 - Reload sshd to apply cryptographic settings"
    ansible.builtin.service:
      name: sshd
      state: reloaded
    register: _step04_output
    failed_when: false
    when: (_package_installed | default(false) | bool) and (_sshd_installed | default(false) | bool)
    tags: [execute]

  - name: "Req step-04 - Store sshd reload details"
    ansible.builtin.set_fact:
      task_04_name: "Reload sshd service"
      task_04_cmd: "systemctl reload-or-restart sshd"
      task_04_rc: "{{ _step04_output.rc | default(-1) }}"
      data_04: "{{ 'Service reloaded' if _step04_output.state | default('') == 'reloaded' else 'Reload status unknown' }}"
      status_04: "{{ 'PASS' if _step04_output is success else 'FAIL' }}"
      details_04: "{{ 'sshd reloaded successfully' if _step04_output is success else 'sshd reload failed' }}"
    when: (_package_installed | default(false) | bool) and (_sshd_installed | default(false) | bool)
    tags: [execute]

# Requirement 5 - Verify ciphers
  - name: "Req step-05 - Verify sshd ciphers configuration"
    ansible.builtin.shell: "set -o pipefail && sshd -T | grep -i ciphers"
    args:
      executable: /bin/bash
    register: _step05_output
    failed_when: false
    changed_when: false
    when: (_package_installed | default(false) | bool) and (_sshd_installed | default(false) | bool)
    tags: [execute]

  - name: "Req step-05 - Store verification details"
    ansible.builtin.set_fact:
      task_05_name: "Verify sshd ciphers"
      task_05_cmd: "sshd -T | grep -i ciphers"
      task_05_rc: "{{ _step05_output.rc | default(-1) }}"
      data_05: "{{ _step05_output.stdout | default('') | trim }}"
      status_05: >-
        {{ 'PASS' if (_step05_output.stdout | default('') is search('ciphers')
            and not _step05_output.stdout | default('') is search('3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc|chacha20-poly1305'))
            else 'FAIL' }}
      details_05: >-
        {{ 'No weak ciphers present' if (_step05_output.stdout | default('') is search('ciphers')
            and not _step05_output.stdout | default('') is search('3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc|chacha20-poly1305'))
            else 'Weak ciphers detected' }}
    when: (_package_installed | default(false) | bool) and (_sshd_installed | default(false) | bool)
    tags: [execute]

# Requirement 6 - Set cis_result
  - name: "Req step-06 - Store final remediation result"
    ansible.builtin.set_fact:
      cis_result: >-
        {{ 'SKIP' if (not (_package_installed | default(false))) or (not (_sshd_installed | default(false)))
           else (status_05 | default('FAIL') | trim) }}
    tags: [execute]

# Requirement 7 - Generate report
  - name: "Req step-07 - Generate remediation report"
    ansible.builtin.debug:
      msg:
      - "REMEDIATION REPORT — CIS 5.1.4"
      - "Reference: CIS Benchmark checkpoint 5.1.4"
      - ""
      - "REQUIREMENT 09 - {{ req_09 }}:"
      - "  Task: {{ task_09_name | default('Not recorded') }}"
      - "  Command: {{ task_09_cmd | default('N/A') }}"
      - "  Exit code: {{ task_09_rc | default(-1) }}"
      - "  Data: {{ data_09 | default('') | trim }}"
      - "  Status: {{ status_09 | default('ERROR') | trim }}"
      - "  Details: {{ details_09 | default('') | trim }}"
      - ""
      - "REQUIREMENT 01 - {{ req_01 }}:"
      - "  Task: {{ task_01_name | default('Not recorded') }}"
      - "  Command: {{ task_01_cmd | default('N/A') }}"
      - "  Exit code: {{ task_01_rc | default(-1) }}"
      - "  Data: {{ data_01 | default('') | trim }}"
      - "  Status: {{ status_01 | default('ERROR') | trim }}"
      - "  Details: {{ details_01 | default('') | trim }}"
      - ""
      - "REQUIREMENT 02 - {{ req_02 }}:"
      - "  Task: {{ task_02_name | default('Not recorded') }}"
      - "  Command: {{ task_02_cmd | default('N/A') }}"
      - "  Exit code: {{ task_02_rc | default(-1) }}"
      - "  Data: {{ data_02 | default('') | trim }}"
      - "  Status: {{ status_02 | default('ERROR') | trim }}"
      - "  Details: {{ details_02 | default('') | trim }}"
      - ""
      - "REQUIREMENT 03 - {{ req_03 }}:"
      - "  Task: {{ task_03_name | default('Not recorded') }}"
      - "  Command: {{ task_03_cmd | default('N/A') }}"
      - "  Exit code: {{ task_03_rc | default(-1) }}"
      - "  Data: {{ data_03 | default('') | trim }}"
      - "  Status: {{ status_03 | default('ERROR') | trim }}"
      - "  Details: {{ details_03 | default('') | trim }}"
      - ""
      - "REQUIREMENT 04 - {{ req_04 }}:"
      - "  Task: {{ task_04_name | default('Not recorded') }}"
      - "  Command: {{ task_04_cmd | default('N/A') }}"
      - "  Exit code: {{ task_04_rc | default(-1) }}"
      - "  Data: {{ data_04 | default('') | trim }}"
      - "  Status: {{ status_04 | default('ERROR') | trim }}"
      - "  Details: {{ details_04 | default('') | trim }}"
      - ""
      - "REQUIREMENT 05 - {{ req_05 }}:"
      - "  Task: {{ task_05_name | default('Not recorded') }}"
      - "  Command: {{ task_05_cmd | default('N/A') }}"
      - "  Exit code: {{ task_05_rc | default(-1) }}"
      - "  Data: {{ data_05 | default('') | trim }}"
      - "  Status: {{ status_05 | default('ERROR') | trim }}"
      - "  Details: {{ details_05 | default('') | trim }}"
      - ""
      - "REQUIREMENT 06 - {{ req_06 }}:"
      - "  Task: Store final remediation result in cis_result"
      - "  Command: N/A"
      - "  Exit code: N/A"
      - "  Data: {{ cis_result | default('ERROR') | trim }}"
      - "  Status: {{ cis_result | default('ERROR') | trim }}"
      - "  Details: Overall remediation status"
      - ""
      - "========================================================"
      - "OVERALL REMEDIATION:"
      - "  Result: {{ cis_result | default('ERROR') | trim }}"
      - "  Details: {{ details_05 | default('Not evaluated') | trim }}"
      - "========================================================"
    tags: [execute]

  always:
        # STATE GUARD — RESTORE

  - name: "Restore - Check if checkpoint exists"
    ansible.builtin.stat:
      path: "{{ state_guard_flag }}"
    register: _sg_restore_flag
    failed_when: false
    when: not (persistent_remediation | default(true) | bool)
    tags: [restore]

  - name: "Restore - Check if backup of NO-SSHWEAKCIPHERS.pmod exists"
    ansible.builtin.stat:
      path: "{{ state_guard_dir }}/NO-SSHWEAKCIPHERS.pmod.present"
    register: _sg_restore_pmod_backup
    failed_when: false
    when:
    - not (persistent_remediation | default(true) | bool)
    - _sg_restore_flag.stat.exists | default(false)
    tags: [restore]

  - name: "Restore - Restore original NO-SSHWEAKCIPHERS.pmod from backup"
    ansible.builtin.copy:
      src: "{{ state_guard_dir }}/NO-SSHWEAKCIPHERS.pmod.present"
      dest: "/etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod"
      remote_src: true
    when:
    - not (persistent_remediation | default(true) | bool)
    - _sg_restore_flag.stat.exists | default(false)
    - _sg_restore_pmod_backup.stat.exists | default(false)
    failed_when: false
    tags: [restore]

  - name: "Restore - Check if NO-SSHWEAKCIPHERS.pmod was originally absent"
    ansible.builtin.stat:
      path: "{{ state_guard_dir }}/NO-SSHWEAKCIPHERS.pmod.absent"
    register: _sg_restore_pmod_absent_marker
    failed_when: false
    when:
    - not (persistent_remediation | default(true) | bool)
    - _sg_restore_flag.stat.exists | default(false)
    tags: [restore]

  - name: "Restore - Delete NO-SSHWEAKCIPHERS.pmod if originally absent"
    ansible.builtin.file:
      path: "/etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod"
      state: absent
    when:
    - not (persistent_remediation | default(true) | bool)
    - _sg_restore_flag.stat.exists | default(false)
    - _sg_restore_pmod_absent_marker.stat.exists | default(false)
    failed_when: false
    tags: [restore]

  - name: "Restore - Read saved crypto policy"
    ansible.builtin.slurp:
      src: "{{ state_guard_dir }}/current_policy.state"
    register: _sg_restore_policy_data
    failed_when: false
    when: not (persistent_remediation | default(true) | bool)
    tags: [restore]

  - name: "Restore - Re-apply original crypto policy"
    ansible.builtin.shell: "update-crypto-policies --set {{ (_sg_restore_policy_data.content | b64decode | trim) }}"
    args:
      executable: /bin/bash
    when:
    - not (persistent_remediation | default(true) | bool)
    - _sg_restore_flag.stat.exists | default(false)
    - _sg_restore_policy_data is defined and _sg_restore_policy_data.content is defined
    - (_sg_restore_policy_data.content | b64decode | trim) != ''
    failed_when: false
    tags: [restore]

  - name: "Restore - Reload sshd to apply original crypto policy"
    ansible.builtin.service:
      name: sshd
      state: reloaded
    when:
    - not (persistent_remediation | default(true) | bool)
    - _sg_restore_flag.stat.exists | default(false)
    - _sg_restore_policy_data is defined and _sg_restore_policy_data.content is defined
    - (_sg_restore_policy_data.content | b64decode | trim) != ''
    failed_when: false
    tags: [restore]

  - name: "Restore - Read original module file list"
    ansible.builtin.slurp:
      src: "{{ state_guard_dir }}/modules_filelist.txt"
    register: _sg_restore_orig_list
    failed_when: false
    when:
    - not (persistent_remediation | default(true) | bool)
    - _sg_restore_flag.stat.exists | default(false)
    tags: [restore]

  - name: "Restore - Get current module file list"
    ansible.builtin.shell: find /etc/crypto-policies/policies/modules/ -maxdepth 1 -type f -printf '%f\n'
    args:
      executable: /bin/bash
    register: _sg_restore_current_list
    failed_when: false
    changed_when: false
    when:
    - not (persistent_remediation | default(true) | bool)
    - _sg_restore_flag.stat.exists | default(false)
    tags: [restore]

  - name: "Restore - Delete extra files created during remediation"
    ansible.builtin.shell: |
      set -o pipefail
      orig_files=($(echo "{{ (_sg_restore_orig_list.content | b64decode | trim | split('\n')) | join(' ') }}"))
      curr_files=($(echo "{{ _sg_restore_current_list.stdout | trim | split('\n') | join(' ') }}"))
      for f in "${curr_files[@]}"; do
        if [[ ! " ${orig_files[*]} " =~ " $f " ]]; then
          rm -f "/etc/crypto-policies/policies/modules/$f"
        fi
      done
    args:
      executable: /bin/bash
    when:
    - not (persistent_remediation | default(true) | bool)
    - _sg_restore_flag.stat.exists | default(false)
    failed_when: false
    tags: [restore]

  - name: "Restore - Remove checkpoint directory"
    ansible.builtin.file:
      path: "{{ state_guard_dir }}"
      state: absent
    when:
    - not (persistent_remediation | default(true) | bool)
    - _sg_restore_flag.stat.exists | default(false)
    failed_when: false
    tags: [restore]
