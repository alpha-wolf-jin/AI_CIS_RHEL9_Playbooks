checkpoint_id: "cis_1_6_3"
state_guard_dir: "/usr/local/bin/cis/.cis_state_guard/{{ checkpoint_id }}"
state_guard_flag: "{{ state_guard_dir }}/checkpoint.flag"
req_01: "Apply prerequisite check for crypto-policies-scripts package using command: `rpm -q crypto-policies-scripts`. Expected result: package is installed."
req_02: |
  Apply SHA1 subpolicy file creation using command: `printf '%s\n' \"# This is a subpolicy dropping the SHA1 hash and signature support\" \"hash = -SHA1\" \"sign = -*-SHA1\" \"sha1_in_certs = 0\" >> /etc/crypto-policies/policies/modules/NO-SHA1.pmod`. Expected result: file /etc/crypto-policies/policies/modules/NO-SHA1.pmod exists with the specified content.
req_03: "Apply system-wide crypto policy update using command: `update-crypto-policies --set DEFAULT:NO-SHA1`. Expected result: command completes successfully and policy is set."
req_04: "Apply system reboot using command: `reboot`. Expected result: system restarts."
req_05: "Verify SHA1 hash and signature support is disabled using command: `update-crypto-policies --show`. Expected result: output includes NO-SHA1 in the active policy."
req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_07: "Create a task named 'Generate remediation report' using debug msg with EXACTLY this format: ..."
