playbook_name: "cis_1_1_1_remediation"
backup_dir: |-
  C:\\ai-playbooks-backup\\{{ playbook_name | trim }}
secpol_cfg_path: |-
  C:\\secpol.cfg
verify_cfg_path: |-
  C:\\verify.cfg
secedit_db_path: |-
  C:\\Windows\\security\\database\\secedit.sdb
req_01: "Detect server role using command: `(Get-WmiObject Win32_ComputerSystem).DomainRole`. Expected result: 4 or 5 for Domain Controller, 1-3 for Member Server."
req_02: "If Domain Controller, apply password history of 24 via command: `Set-ADDefaultDomainPasswordPolicy -Identity <DomainDN> -PasswordHistoryCount 24`. Expected result: policy updated."
req_03: |-
  If Member Server, export current security policy using command: `secedit /export /cfg C:\\secpol.cfg`. Expected result: configuration file created.
req_04: |-
  If Member Server, edit C:\\secpol.cfg to set `PasswordHistorySize = 24` under [System Access]. Expected result: value changed.
req_05: |-
  If Member Server, apply policy using command: `secedit /configure /db secedit.sdb /cfg C:\\secpol.cfg /areas SECURITYPOLICY`. Expected result: policy applied.
req_06: "Verify Domain Controller setting using command: `Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty PasswordHistoryCount`. Expected result: 24."
req_07: |-
  Verify Member Server setting using command: `secedit /export /cfg C:\\verify.cfg` then check `PasswordHistorySize` equals 24. Expected result: value confirmed.
req_08: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
