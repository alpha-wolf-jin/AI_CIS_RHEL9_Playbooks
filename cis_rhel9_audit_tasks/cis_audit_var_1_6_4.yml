req_01: "Check if the system-wide crypto policy state file exists using command: `test -f /etc/crypto-policies/state/CURRENT.pol`. Expected result: exit code 0 (file exists)."
req_02: |
  Check that no MAC algorithms with less than 128 bits are enabled in the system-wide crypto policy using command: `grep -Pi -- '^\\h*mac\\h*=\\h*([^#\\n\\r]+)?-64\\b' /etc/crypto-policies/state/CURRENT.pol`. Expected result: no output (nothing returned).
req_03: "Check overall compliance status: PASS if the policy file exists and the grep command returns no output; SKIP if the policy file does not exist; FAIL if the policy file exists but the grep command returns any output."
req_04: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
