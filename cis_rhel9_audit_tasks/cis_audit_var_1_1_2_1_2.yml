req_01: "Check if /tmp is a separate partition using command: `findmnt -kn /tmp`. Expected result: output contains a mount point for /tmp."
req_02: "Check if the nodev option is set on the /tmp partition using command: `findmnt -kn /tmp | grep -v nodev`. Expected result: no output (empty)."
req_03: "Check overall compliance status: PASS if the separate partition exists and nodev is set; SKIP if /tmp is not a separate partition; FAIL if /tmp is a separate partition but nodev is not set."
req_04: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
fs_option: "nodev"
