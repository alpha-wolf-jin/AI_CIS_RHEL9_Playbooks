---
- name: Initialize meta data variables
  include_vars: cis_audit_var_1_6_3.yml

- name: "Req step-01 - Gather package facts"
  ansible.builtin.package_facts:
    manager: auto
  tags: [audit]
- name: "Req step-01 - Set crypto-policies installed flag and skip reason"
  ansible.builtin.set_fact:
    crypto_policies_installed: "{{ 'crypto-policies' in ansible_facts.packages }}"
    audit_skip_reason: "{{ '' if ('crypto-policies' in ansible_facts.packages) else 'crypto-policies package is not installed' }}"
  tags: [audit]
- name: "Initialize data variables"
  ansible.builtin.set_fact:
    task_01_name: "Check policy file existence"
    task_01_cmd: "test -f {{ policy_file }}"
    task_01_rc: -1
    data_01: ""
    status_01: "SKIP"
    details_01: "{{ 'Skipped: ' + audit_skip_reason if audit_skip_reason != '' else 'File existence status pending' }}"
    task_02_name: "Check hash/sign directives for SHA1"
    task_02_cmd: |
      awk -F= '($1~/(hash|sign)/ && $2~/SHA1/ && $2!~/^\\s*-\\s*([^#\\n\\r]+)?SHA1/){print}' {{ policy_file }}
    task_02_rc: -1
    data_02: ""
    status_02: "SKIP"
    details_02: "Not evaluated"
    task_03_name: "Check sha1_in_certs parameter"
    task_03_cmd: |
      grep -Psi -- '^\\h*sha1_in_certs\\h*=\\h*' {{ policy_file }}
    task_03_rc: -1
    data_03: ""
    status_03: "SKIP"
    details_03: "Not evaluated"
    status_04: "ERROR"
    details_04: "Not evaluated"
    status_05: "ERROR"
    details_05: ""
    cis_result: "ERROR"
    cis_result_comment: ""
    cis_raw_output: ""
  tags: [audit]
- name: "Req step-01 - Check policy file exists"
  ansible.builtin.shell: test -f "{{ policy_file }}"
  args:
    executable: /bin/bash
  register: _step01_output
  when: crypto_policies_installed | bool
  failed_when: false
  changed_when: false
  tags: [audit]
- name: "Req step-01 - Store details for file existence"
  ansible.builtin.set_fact:
    task_01_rc: "{{ _step01_output.rc | default(-1) }}"
    data_01: "{{ _step01_output.stdout | default('') | trim }}"
    status_01: "{{ 'PASS' if _step01_output.rc | default(-1) == 0 else 'SKIP' }}"
    details_01: "{{ 'Policy file exists' if _step01_output.rc | default(-1) == 0 else 'Policy file not found; audit skipped' }}"
  when: _step01_output is defined
  tags: [audit]
- name: "Req step-02 - Check hash/sign directives for SHA1"
  ansible.builtin.shell: |
    set -o pipefail
    awk -F= '($1~/(hash|sign)/ && $2~/SHA1/ && $2!~/^\s*-\s*([^#\n\r]+)?SHA1/){print}' "{{ policy_file }}"
  args:
    executable: /bin/bash
  register: _step02_output
  when:
  - crypto_policies_installed | bool
  - _step01_output is defined
  - _step01_output.rc | default(-1) == 0
  failed_when: false
  changed_when: false
  tags: [audit]
- name: "Req step-02 - Store details for SHA1 check"
  ansible.builtin.set_fact:
    task_02_rc: "{{ _step02_output.rc | default(-1) }}"
    data_02: "{{ _step02_output.stdout | default('') | trim }}"
    status_02: "{{ 'PASS' if (_step02_output.stdout | default('') | trim == '') else 'FAIL' }}"
    details_02: "{{ 'No uncommented SHA1 lines found' if (_step02_output.stdout | default('') | trim == '') else 'Uncommented SHA1 lines found' }}"
  when: _step02_output is defined
  tags: [audit]
- name: "Req step-03 - Check sha1_in_certs setting"
  ansible.builtin.shell: |
    grep -Psi -- '^\h*sha1_in_certs\h*=\h*' "{{ policy_file }}"
  args:
    executable: /bin/bash
  register: _step03_output
  when:
  - crypto_policies_installed | bool
  - _step01_output is defined
  - _step01_output.rc | default(-1) == 0
  failed_when: false
  changed_when: false
  tags: [audit]
- name: "Req step-03 - Store details for sha1_in_certs"
  ansible.builtin.set_fact:
    task_03_rc: "{{ _step03_output.rc | default(-1) }}"
    data_03: "{{ _step03_output.stdout | default('') | trim }}"
    status_03: "{{ 'PASS' if ('sha1_in_certs = 0' in (_step03_output.stdout | default('') | trim)) else 'FAIL' }}"
    details_03: "{{ 'sha1_in_certs is set to 0' if ('sha1_in_certs = 0' in (_step03_output.stdout | default('') | trim)) else 'sha1_in_certs is not set to 0 or missing' }}"
  when: _step03_output is defined
  tags: [audit]
- name: "Req step-04 - Determine overall compliance status"
  ansible.builtin.set_fact:
    status_04: >-
      {%- if not crypto_policies_installed | bool -%}SKIP
      {%- elif _step01_output is not defined or _step01_output.rc | default(-1) != 0 -%}SKIP
      {%- elif _step02_output is defined and _step03_output is defined and (_step02_output.stdout | default('') | trim == '') and ('sha1_in_certs = 0' in (_step03_output.stdout | default('') | trim)) -%}PASS
      {%- else -%}FAIL{%- endif -%}
    details_04: >-
      {%- if not crypto_policies_installed | bool -%}crypto-policies package not installed; skip audit
      {%- elif _step01_output is not defined or _step01_output.rc | default(-1) != 0 -%}Policy file not found; skip audit
      {%- elif _step02_output is defined and _step03_output is defined and (_step02_output.stdout | default('') | trim == '') and ('sha1_in_certs = 0' in (_step03_output.stdout | default('') | trim)) -%}All checks passed
      {%- else -%}SHA1 support is enabled or sha1_in_certs not set to 0{%- endif -%}
  register: _step04_output
  tags: [audit]
- name: "Req step-05 - Store final audit result in cis_result"
  ansible.builtin.set_fact:
    cis_result: "{{ status_04 | default('ERROR') | trim }}"
    cis_result_comment: "{{ _step02_output.stdout | default('') | trim if _step02_output is defined else '' }}"
    cis_raw_output: "{{ _step03_output.stdout | default('') | trim if _step03_output is defined else '' }}"
    status_05: "PASS"
    details_05: "cis_result stored with raw outputs from step-02 and step-03"
  tags: [audit]
- name: "Req step-06 - Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 1.6.3"
    - "Reference: CIS Benchmark checkpoint 1.6.3"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name }}"
    - "  Command: {{ task_01_cmd }}"
    - "  Exit code: {{ task_01_rc }}"
    - "  Data: {{ data_01 }}"
    - "  Status: {{ status_01 }}"
    - "  Details: {{ details_01 }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name }}"
    - "  Command: {{ task_02_cmd }}"
    - "  Exit code: {{ task_02_rc }}"
    - "  Data: {{ data_02 }}"
    - "  Status: {{ status_02 }}"
    - "  Details: {{ details_02 }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name }}"
    - "  Command: {{ task_03_cmd }}"
    - "  Exit code: {{ task_03_rc }}"
    - "  Data: {{ data_03 }}"
    - "  Status: {{ status_03 }}"
    - "  Details: {{ details_03 }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: Determine overall compliance"
    - "  Command: N/A"
    - "  Exit code: 0"
    - "  Data: N/A"
    - "  Status: {{ status_04 }}"
    - "  Details: {{ details_04 }}"
    - ""
    - "REQUIREMENT 05 - {{ req_05 }}:"
    - "  Task: Store final audit result"
    - "  Command: set_fact"
    - "  Exit code: 0"
    - "  Data: {{ cis_result_comment }}"
    - "  Status: {{ status_05 }}"
    - "  Details: {{ details_05 }}"
    - ""
    - "REQUIREMENT 06 - {{ req_06 }}:"
    - "  Task: Generate audit report"
    - "  Command: debug"
    - "  Exit code: 0"
    - "  Data: N/A"
    - "  Status: PASS"
    - "  Details: Report generated"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result }}"
    - "========================================================"
  tags: [audit]
