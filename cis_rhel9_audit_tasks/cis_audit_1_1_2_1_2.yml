---
- name: Initialize meta data variables
  include_vars: cis_audit_var_1_1_2_1_2.yml

- name: "Initialize data variables"
  set_fact:
    task_01_name: "Not recorded"
    task_01_cmd: "N/A"
    task_01_rc: -1
    data_01: "Not collected"
    status_01: "ERROR"
    details_01: "Not evaluated"
    task_02_name: "Not recorded"
    task_02_cmd: "N/A"
    task_02_rc: -1
    data_02: "Not collected"
    status_02: "SKIP"
    details_02: "Not evaluated"
    task_03_name: "Not recorded"
    task_03_cmd: "N/A"
    task_03_rc: -1
    data_03: "Not collected"
    status_03: "ERROR"
    details_03: "Not evaluated"
    task_04_name: "Not recorded"
    task_04_cmd: "N/A"
    task_04_rc: -1
    data_04: "Not collected"
    status_04: "ERROR"
    details_04: "Not evaluated"

- name: "Req 01 - Check if /tmp is a separate partition"
  ansible.builtin.shell: findmnt -kn /tmp
  args:
    executable: /bin/bash
  register: result_01
  failed_when: false
  changed_when: false

- name: "Store requirement 01 details"
  set_fact:
    task_01_name: "Check if /tmp is a separate partition"
    task_01_cmd: "findmnt -kn /tmp"
    task_01_rc: "{{ result_01.rc | default(-1) }}"
    data_01: "{{ result_01.stdout | default('') | trim }}"
    status_01: "{{ ('PASS' if result_01.stdout | default('') | trim != '' else 'FAIL') | trim }}"
    details_01: "{{ ('Separate partition exists' if result_01.stdout | default('') | trim != '' else 'No separate partition for /tmp') | trim }}"

- name: "Req 02 - Check if nodev option is set on /tmp partition"
  ansible.builtin.shell: "findmnt -kn /tmp | grep -v {{ fs_option }}"
  args:
    executable: /bin/bash
  register: result_02
  failed_when: false
  changed_when: false
  when: "result_01.stdout | default('') | trim != ''"

- name: "Store requirement 02 details"
  set_fact:
    task_02_name: "Check if nodev option is set on /tmp partition"
    task_02_cmd: "findmnt -kn /tmp | grep -v {{ fs_option }}"
    task_02_rc: "{{ result_02.rc | default(-1) if result_02 is defined else -1 }}"
    data_02: "{{ result_02.stdout | default('') | trim if result_02 is defined else '' }}"
    status_02: "{{ ('SKIP' if result_02 is not defined else ('PASS' if (result_02.stdout | default('') | trim == '') else 'FAIL')) | trim }}"
    details_02: "{{ ('Skipped: /tmp is not a separate partition' if result_02 is not defined else ('nodev option is set' if (result_02.stdout | default('') | trim == '') else 'nodev option is NOT set')) | trim }}"

- name: "Req 03 - Evaluate overall compliance"
  set_fact:
    task_03_name: "Evaluate overall compliance"
    task_03_cmd: "N/A"
    task_03_rc: 0
    data_03: "{{ status_02 | default('') | trim }}"
    status_03: >-
      {%- if data_01 | default('') | trim == '' -%}
        SKIP
      {%- elif status_02 | default('') | trim == 'PASS' -%}
        PASS
      {%- else -%}
        FAIL
      {%- endif -%}
    details_03: >-
      {%- if data_01 | default('') | trim == '' -%}
        /tmp is not a separate partition — audit skipped
      {%- elif status_02 | default('') | trim == 'PASS' -%}
        /tmp is a separate partition and nodev option is set
      {%- else -%}
        /tmp is a separate partition but nodev option is NOT set
      {%- endif -%}

- name: "Req 04 - Store final audit result"
  set_fact:
    cis_result: "{{ status_03 | default('ERROR') | trim }}"
    task_04_name: "Store final audit result"
    task_04_cmd: "N/A"
    task_04_rc: 0
    data_04: "{{ status_03 | default('') | trim }}"
    status_04: "{{ status_03 | default('ERROR') | trim }}"
    details_04: "Final compliance status stored"

- name: "Generate audit report"
  debug:
    msg:
    - "AUDIT REPORT — CIS 1.1.2.1.2"
    - "Reference: CIS Benchmark checkpoint 1.1.2.1.2"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ details_02 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('Not evaluated') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not recorded') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('ERROR') | trim }}"
    - "  Details: {{ details_04 | default('') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "========================================================"
