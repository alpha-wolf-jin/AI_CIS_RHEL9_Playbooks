---
- name: Initialize meta data variables
  include_vars: cis_audit_var_6_3_3_1.yml

- name: "Req 01 - Check if auditd is installed"
  ansible.builtin.shell: "command -v auditctl"
  args:
    executable: /bin/bash
  register: result_01
  failed_when: false
  changed_when: false

- name: "Store requirement 01 details"
  ansible.builtin.set_fact:
    task_01_name: "Req 01 - Check if auditd is installed"
    task_01_cmd: "command -v auditctl"
    task_01_rc: "{{ result_01.rc | default(-1) }}"
    data_01: "{{ result_01.stdout | default('') | trim }}"
    status_01: "{{ 'PASS' if result_01.rc | default(-1) == 0 else 'SKIP' }}"
    details_01: "{{ 'auditctl found at ' + (result_01.stdout | default('') | trim) if result_01.rc | default(-1) == 0 else 'auditd not installed' }}"

    # ============================================================
    # Requirement 02
# ============================================================
- name: "Req 02 - Check on-disk audit rules for sudoers files"
  ansible.builtin.shell: |
    awk '/^ *-w/ &&/\/etc\/sudoers/ &&/ +-p *wa/ &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules
  args:
    executable: /bin/bash
  register: result_02
  failed_when: false
  changed_when: false
  when: result_01.rc == 0

- name: "Store requirement 02 details"
  ansible.builtin.set_fact:
    task_02_name: "Req 02 - Check on-disk audit rules for sudoers files"
    task_02_cmd: |
      awk '/^ *-w/ &&/\\/etc\\/sudoers/ &&/ +-p *wa/ &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules
    task_02_rc: "{{ result_02.rc | default(-1) }}"
    data_02: "{{ result_02.stdout | default('') | trim }}"
    status_02: >-
      {%- if status_01 | trim == 'SKIP' -%}SKIP
      {%- else -%}
        {%- set lines = result_02.stdout_lines | default([]) | map('trim') | list -%}
        {{- 'PASS' if ('-w /etc/sudoers -p wa -k scope' in lines) and ('-w /etc/sudoers.d -p wa -k scope' in lines) else 'FAIL' -}}
      {%- endif -%}
    details_02: >-
      {%- if status_01 | trim == 'SKIP' -%}Auditd not installed
      {%- else -%}
        {%- set lines = result_02.stdout_lines | default([]) | map('trim') | list -%}
        {{- 'Both rules present on disk' if ('-w /etc/sudoers -p wa -k scope' in lines) and ('-w /etc/sudoers.d -p wa -k scope' in lines) else 'One or both rules missing or incorrect on disk' -}}
      {%- endif -%}

    # ============================================================
    # Requirement 03
# ============================================================
- name: "Req 03 - Check loaded audit rules for sudoers files"
  ansible.builtin.shell: |
    set -o pipefail
    auditctl -l | awk '/^ *-w/ &&/\/etc\/sudoers/ &&/ +-p *wa/ &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'
  args:
    executable: /bin/bash
  register: result_03
  failed_when: false
  changed_when: false
  when: result_01.rc == 0

- name: "Store requirement 03 details"
  ansible.builtin.set_fact:
    task_03_name: "Req 03 - Check loaded audit rules for sudoers files"
    task_03_cmd: |
      auditctl -l | awk '/^ *-w/ &&/\\/etc\\/sudoers/ &&/ +-p *wa/ &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'
    task_03_rc: "{{ result_03.rc | default(-1) }}"
    data_03: "{{ result_03.stdout | default('') | trim }}"
    status_03: >-
      {%- if status_01 | trim == 'SKIP' -%}SKIP
      {%- else -%}
        {%- set lines = result_03.stdout_lines | default([]) | map('trim') | list -%}
        {{- 'PASS' if ('-w /etc/sudoers -p wa -k scope' in lines) and ('-w /etc/sudoers.d -p wa -k scope' in lines) else 'FAIL' -}}
      {%- endif -%}
    details_03: >-
      {%- if status_01 | trim == 'SKIP' -%}Auditd not installed
      {%- else -%}
        {%- set lines = result_03.stdout_lines | default([]) | map('trim') | list -%}
        {{- 'Both rules loaded' if ('-w /etc/sudoers -p wa -k scope' in lines) and ('-w /etc/sudoers.d -p wa -k scope' in lines) else 'One or both rules not loaded or incorrect' -}}
      {%- endif -%}

    # ============================================================
    # Requirement 04 – overall compliance evaluation
# ============================================================
- name: "Req 04 - Determine overall compliance status"
  ansible.builtin.set_fact:
    status_04: >-
      {%- if status_01 | trim == 'SKIP' -%}
      SKIP
      {%- elif status_02 | trim == 'PASS' and status_03 | trim == 'PASS' -%}
      PASS
      {%- else -%}
      FAIL
      {%- endif -%}
    details_04: >-
      {%- if status_01 | trim == 'SKIP' -%}
      Auditd is not installed
      {%- elif status_02 | trim == 'PASS' and status_03 | trim == 'PASS' -%}
      All audit rules for sudoers scope are correctly configured
      {%- else -%}
      One or more audit rules for sudoers scope are missing or incorrect
      {%- endif -%}
    task_04_name: "Req 04 - Overall compliance evaluation"
    task_04_cmd: "n/a"
    task_04_rc: 0
    data_04: "n/a"

    # ============================================================
    # Requirement 05 – store cis_result
# ============================================================
- name: "Req 05 - Store final audit result in cis_result"
  ansible.builtin.set_fact:
    cis_result: "{{ status_04 | default('ERROR') | trim }}"
    task_05_name: "Req 05 - Store cis_result"
    task_05_cmd: "set_fact cis_result"
    task_05_rc: 0
    data_05: "n/a"
    status_05: "{{ status_04 | default('ERROR') | trim }}"
    details_05: "cis_result set to {{ status_04 | default('ERROR') | trim }}"

    # ============================================================
    # Requirement 06 – Generate audit report
# ============================================================
- name: "Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 6.3.3.1"
    - "Reference: CIS Benchmark checkpoint 6.3.3.1"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ details_02 | default('Not evaluated') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('Not evaluated') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not recorded') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('ERROR') | trim }}"
    - "  Details: {{ details_04 | default('Not evaluated') | trim }}"
    - ""
    - "REQUIREMENT 05 - {{ req_05 }}:"
    - "  Task: {{ task_05_name | default('Not recorded') }}"
    - "  Command: {{ task_05_cmd | default('N/A') }}"
    - "  Exit code: {{ task_05_rc | default(-1) }}"
    - "  Data: {{ data_05 | default('') | trim }}"
    - "  Status: {{ status_05 | default('ERROR') | trim }}"
    - "  Details: {{ details_05 | default('Not evaluated') | trim }}"
    - ""
    - "REQUIREMENT 06 - {{ req_06 }}:"
    - "  Task: Generate audit report"
    - "  Command: debug msg"
    - "  Exit code: 0"
    - "  Data: n/a"
    - "  Status: PASS"
    - "  Details: Audit report generated successfully"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "  Details: {{ details_04 | default('Not evaluated') | trim }}"
    - "========================================================"
