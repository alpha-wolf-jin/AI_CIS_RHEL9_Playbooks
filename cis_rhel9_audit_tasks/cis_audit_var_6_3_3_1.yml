req_01: "Check if auditd is installed using command: `command -v auditctl`. Expected result: path to auditctl binary."
req_02: |
  Check on disk audit rules for /etc/sudoers and /etc/sudoers.d using command: `awk '/^ *-w/ &&/\\/etc\\/sudoers/ &&/ +-p *wa/ &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules`. Expected result: `-w /etc/sudoers -p wa -k scope` and `-w /etc/sudoers.d -p wa -k scope`.
req_03: |
  Check loaded audit rules for /etc/sudoers and /etc/sudoers.d using command: `auditctl -l | awk '/^ *-w/ &&/\\/etc\\/sudoers/ &&/ +-p *wa/ &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'`. Expected result: `-w /etc/sudoers -p wa -k scope` and `-w /etc/sudoers.d -p wa -k scope`.
req_04: "Check overall compliance status: PASS if all previous checks pass, SKIP if auditd is not installed, FAIL if auditd is installed but rules are missing or incorrect."
req_05: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_06: "Create a task named 'Generate audit report' using debug msg with EXACTLY this format: AUDIT REPORT — CIS 6.3.3.1... (as specified)"
