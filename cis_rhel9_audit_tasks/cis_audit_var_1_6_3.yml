req_01: "Check if the system-wide crypto policy file exists using command: `test -f /etc/crypto-policies/state/CURRENT.pol`. Expected result: file exists (exit code 0)."
req_02: |
  Check that SHA1 hash and signature support is disabled in the system-wide crypto policy using command: `awk -F= '($1~/(hash|sign)/ && $2~/SHA1/ && $2!~/^\\s*-\\s*([^#\\n\\r]+)?SHA1/){print}' /etc/crypto-policies/state/CURRENT.pol`. Expected result: no output (nothing returned).
req_03: |
  Check that sha1_in_certs is set to 0 (disabled) using command: `grep -Psi -- '^\\h*sha1_in_certs\\h*=\\h*' /etc/crypto-policies/state/CURRENT.pol`. Expected result: output contains `sha1_in_certs = 0`.
req_04: "Overall compliance status: PASS if all above checks pass, SKIP if the crypto policy file does not exist, FAIL if the file exists but SHA1 hash/signature support is enabled or sha1_in_certs is not set to 0."
req_05: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
