---
- name: Initialize meta data variables
  include_vars: cis_audit_var_5_3_3_3_1.yml

- name: "Initialize data variables"
  set_fact:
    data_01: ""
    status_01: "ERROR"
    details_01: ""
    task_01_name: "Not executed"
    task_01_cmd: "N/A"
    task_01_rc: -1
    data_02: ""
    status_02: "ERROR"
    details_02: ""
    task_02_name: "Not executed"
    task_02_cmd: "N/A"
    task_02_rc: -1
    data_03: ""
    status_03: "ERROR"
    details_03: ""
    task_03_name: "Not executed"
    task_03_cmd: "N/A"
    task_03_rc: -1
    data_04: ""
    status_04: "ERROR"
    details_04: ""
    task_04_name: "Not executed"
    task_04_cmd: "N/A"
    task_04_rc: -1
    data_05: ""
    status_05: "ERROR"
    details_05: ""
    task_05_name: "Not executed"
    task_05_cmd: "N/A"
    task_05_rc: -1
    data_06: ""
    status_06: "ERROR"
    details_06: ""
    task_06_name: "Not executed"
    task_06_cmd: "N/A"
    task_06_rc: -1

- name: "Req 01 - Check if pwhistory.conf exists"
  ansible.builtin.stat:
    path: /etc/security/pwhistory.conf
  register: result_01
  failed_when: false

- name: "Store requirement 01 details"
  set_fact:
    task_01_name: "Check pwhistory.conf existence"
    task_01_cmd: "stat /etc/security/pwhistory.conf"
    task_01_rc: "{{ result_01.stat.exists | ternary(0, 1) }}"
    data_01: "{{ result_01.stat.exists | ternary('EXISTS', 'MISSING') }}"
    status_01: "{{ 'PASS' if result_01.stat.exists else 'FAIL' }}"
    details_01: "{{ 'File exists' if result_01.stat.exists else 'File does not exist' }}"

- name: "Req 02 - Check remember value in pwhistory.conf"
  ansible.builtin.shell: |
    grep -Pi -- '^\h*remember\h*=\h*(2[4-9]|[3-9][0-9]|[1-9][0-9]{2,})\b' /etc/security/pwhistory.conf
  args:
    executable: /bin/bash
  register: result_02
  failed_when: false
  changed_when: false

- name: "Store requirement 02 details"
  set_fact:
    task_02_name: "Check remember option >= 24 in pwhistory.conf"
    task_02_cmd: |
      grep -Pi -- '^\h*remember\h*=\h*(2[4-9]|[3-9][0-9]|[1-9][0-9]{2,})\b' /etc/security/pwhistory.conf
    task_02_rc: "{{ result_02.rc | default(-1) }}"
    data_02: "{{ result_02.stdout | default('') | trim }}"
    status_02: "{{ 'PASS' if (result_02.rc | default(-1) == 0 and (result_02.stdout | default('') | trim | length > 0)) else 'FAIL' }}"
    details_02: "{{ 'Found matching line: ' ~ (result_02.stdout | default('') | trim) if (result_02.rc | default(-1) == 0) else 'No match or file missing' }}"

- name: "Detect PAM file path (authselect-aware)"
  ansible.builtin.shell: |
    PROFILE=$(authselect current --raw 2>/dev/null || true)
    if [[ "$PROFILE" =~ ^custom/ ]]; then
      NAME="${PROFILE#custom/}"
      echo "/etc/authselect/custom/$NAME"
    else
      echo "/etc/pam.d"
    fi
  args:
    executable: /bin/bash
  register: _pam_dir_result
  failed_when: false
  changed_when: false

- name: "Set pam_dir fact"
  set_fact:
    _pam_dir: "{{ _pam_dir_result.stdout | trim | default('/etc/pam.d') }}"

- name: "Req 03 - Check remember less than 24 in system-auth"
  ansible.builtin.shell: |
    grep -Pi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwhistory\.so\h+([^#\n\r]+\h+)?remember=(2[0-3]|1[0-9]|[0-9])\b' "{{ _pam_dir }}/system-auth"
  args:
    executable: /bin/bash
  register: result_03
  failed_when: false
  changed_when: false

- name: "Store requirement 03 details"
  set_fact:
    task_03_name: "Check remember < 24 in PAM system-auth"
    task_03_cmd: |
      grep -Pi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwhistory\.so\h+([^#\n\r]+\h+)?remember=(2[0-3]|1[0-9]|[0-9])\b' {{ _pam_dir }}/system-auth
    task_03_rc: "{{ result_03.rc | default(-1) }}"
    data_03: "{{ result_03.stdout | default('') | trim }}"
    status_03: "{{ 'PASS' if (result_03.stdout | default('') | trim | length == 0) else 'FAIL' }}"
    details_03: "{{ 'No bad remember found' if (result_03.stdout | default('') | trim | length == 0) else 'Found bad remember line' }}"

- name: "Req 04 - Check remember less than 24 in password-auth"
  ansible.builtin.shell: |
    grep -Pi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwhistory\.so\h+([^#\n\r]+\h+)?remember=(2[0-3]|1[0-9]|[0-9])\b' "{{ _pam_dir }}/password-auth"
  args:
    executable: /bin/bash
  register: result_04
  failed_when: false
  changed_when: false

- name: "Store requirement 04 details"
  set_fact:
    task_04_name: "Check remember < 24 in PAM password-auth"
    task_04_cmd: |
      grep -Pi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwhistory\.so\h+([^#\n\r]+\h+)?remember=(2[0-3]|1[0-9]|[0-9])\b' {{ _pam_dir }}/password-auth
    task_04_rc: "{{ result_04.rc | default(-1) }}"
    data_04: "{{ result_04.stdout | default('') | trim }}"
    status_04: "{{ 'PASS' if (result_04.stdout | default('') | trim | length == 0) else 'FAIL' }}"
    details_04: "{{ 'No bad remember found' if (result_04.stdout | default('') | trim | length == 0) else 'Found bad remember line' }}"

- name: "Req 05 - Evaluate overall compliance"
  set_fact:
    status_05: >-
      {%- if not (result_01.stat.exists | default(false)) -%}
        SKIP
      {%- elif status_02 | trim == 'PASS' and status_03 | trim == 'PASS' and status_04 | trim == 'PASS' -%}
        PASS
      {%- else -%}
        FAIL
      {%- endif -%}
    details_05: >-
      {%- if not (result_01.stat.exists | default(false)) -%}
        Skipped because /etc/security/pwhistory.conf does not exist
      {%- elif status_02 | trim == 'PASS' and status_03 | trim == 'PASS' and status_04 | trim == 'PASS' -%}
        All checks passed: remember >= 24 in pwhistory.conf, no low remember in PAM files
      {%- else -%}
        One or more checks failed: pwhistory.conf missing or remember value low or PAM files contain low remember
      {%- endif -%}
    task_05_name: "Evaluate overall compliance"
    task_05_cmd: "set_fact"
    task_05_rc: 0
    data_05: "{{ status_05 }}"

- name: "Req 06 - Store final audit result in cis_result"
  set_fact:
    cis_result: "{{ status_05 | default('ERROR') | trim }}"
    status_06: "{{ status_05 | default('ERROR') | trim }}"
    task_06_name: "Set cis_result"
    task_06_cmd: "set_fact"
    task_06_rc: 0
    data_06: "{{ status_05 | default('ERROR') | trim }}"
    details_06: "Final result: {{ status_05 | default('ERROR') | trim }}"

- name: "Generate audit report"
  debug:
    msg:
    - "AUDIT REPORT — CIS 5.3.3.3.1"
    - "Reference: CIS Benchmark checkpoint 5.3.3.3.1"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ details_02 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not recorded') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('ERROR') | trim }}"
    - "  Details: {{ details_04 | default('') | trim }}"
    - ""
    - "REQUIREMENT 05 - {{ req_05 }}:"
    - "  Task: {{ task_05_name | default('Not recorded') }}"
    - "  Command: {{ task_05_cmd | default('N/A') }}"
    - "  Exit code: {{ task_05_rc | default(-1) }}"
    - "  Data: {{ data_05 | default('') | trim }}"
    - "  Status: {{ status_05 | default('ERROR') | trim }}"
    - "  Details: {{ details_05 | default('') | trim }}"
    - ""
    - "REQUIREMENT 06 - {{ req_06 }}:"
    - "  Task: {{ task_06_name | default('Not recorded') }}"
    - "  Command: {{ task_06_cmd | default('N/A') }}"
    - "  Exit code: {{ task_06_rc | default(-1) }}"
    - "  Data: {{ data_06 | default('') | trim }}"
    - "  Status: {{ status_06 | default('ERROR') | trim }}"
    - "  Details: {{ details_06 | default('') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "  Details: {{ details_06 | default('Not evaluated') | trim }}"
    - "========================================================"
