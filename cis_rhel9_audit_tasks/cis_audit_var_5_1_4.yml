req_01: "Check if OpenSSH server is installed using command: `sshd -V 2>&1 || dpkg -l openssh-server 2>/dev/null || rpm -q openssh-server 2>/dev/null`. Expected result: command returns version or package information indicating sshd is present."
req_02: |
  Check sshd configured ciphers for weak algorithms using command: `sshd -T | grep -Pi -- '^ciphers\\h+\\\"?([^#\\n\\r]+,)?((3des|blowfish|cast128|aes(128|192|256))-cbc|arcfour(128|256)?|rijndael-cbc@lysator\\.liu\\.se|chacha20-poly1305@openssh\\.com)\\b'`. Expected result: no output (no weak ciphers listed).
req_03: "If the previous command returns a line containing chacha20-poly1305@openssh.com, check if system is patched against CVE-2023-48795 using command: `sshd -T | grep -i 'chacha20-poly1305@openssh.com' && (grep -i 'CVE-2023-48795' /usr/share/doc/openssh-server/changelog* 2>/dev/null || dpkg -l openssh-server 2>/dev/null | grep -E '^ii' || rpm -q --changelog openssh-server 2>/dev/null | grep -i 'CVE-2023-48795')`. Expected result: patch information or updated version is found."
req_04: |
  Check that none of the specific weak ciphers (3des-cbc, aes128-cbc, aes192-cbc, aes256-cbc) are present in the sshd configuration using command: `sshd -T | grep -E '^ciphers\\s+' | grep -E '(3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc)'`. Expected result: no output.
req_05: "Summarize overall compliance status: PASS if all previous checks pass (no weak ciphers returned, and if chacha20-poly1305 present, patched), SKIP if sshd is not installed, FAIL if any weak cipher is configured or chacha20-poly1305 is present without patch. Expected result: one of PASS, SKIP, or FAIL based on the checks."
req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
