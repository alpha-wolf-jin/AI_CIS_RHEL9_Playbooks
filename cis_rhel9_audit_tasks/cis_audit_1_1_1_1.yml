---
- name: Initialize meta data variables
  include_vars: cis_audit_var_1_1_1_1.yml

- name: "Initialize data variables"
  ansible.builtin.set_fact:
    data_01: "Not collected yet"
    status_01: "ERROR"
    details_01: "Not evaluated"
    task_01_name: "Not executed"
    task_01_cmd: "N/A"
    task_01_rc: -1
    data_02: "Not collected yet"
    status_02: "ERROR"
    details_02: "Not evaluated"
    task_02_name: "Not executed"
    task_02_cmd: "N/A"
    task_02_rc: -1
    data_03: "Not collected yet"
    status_03: "ERROR"
    details_03: "Not evaluated"
    task_03_name: "Not executed"
    task_03_cmd: "N/A"
    task_03_rc: -1
    data_04: "Not collected yet"
    status_04: "ERROR"
    details_04: "Not evaluated"
    task_04_name: "Not executed"
    task_04_cmd: "N/A"
    task_04_rc: -1

# Requirement 1: Run the provided audit script
- name: "Req 1 - Copy audit script to target"
  ansible.builtin.copy:
    dest: "{{ audit_script }}"
    content: "{{ audit_script_content }}"
    mode: '0700'
  failed_when: false
  changed_when: false

- name: "Req step-01 - Execute audit script"
  ansible.builtin.shell: "/bin/bash {{ audit_script }}"
  args:
    executable: /bin/bash
  register: _audit_output
  failed_when: false
  changed_when: false

- name: "Req 1 - Remove temporary script"
  ansible.builtin.file:
    path: "{{ audit_script }}"
    state: absent
  failed_when: false
  changed_when: false

- name: "Req 1 - Store requirement 1 details"
  ansible.builtin.set_fact:
    task_01_name: "Run CIS audit script for cramfs module"
    task_01_cmd: "/bin/bash {{ audit_script }}"
    task_01_rc: "{{ _audit_output.rc }}"
    data_01: "{{ _audit_output.stdout | default('') | trim }}"
    status_01: "{{ 'PASS' if _audit_output.rc | default(-1) == 0 else 'FAIL' }}"
    details_01: "{{ 'Script executed successfully' if _audit_output.rc | default(-1) == 0 else 'Script execution failed with rc ' ~ _audit_output.rc }}"

# Requirement 2: Summarise compliance status
- name: "Req step-02 - Determine compliance status from output"
  ansible.builtin.set_fact:
    compliance_status: >-
      {%- set out = _audit_output.stdout | default('') -%}
      {%- if '** PASS **' in out %}PASS{%- elif '** FAIL **' in out %}FAIL{%- else %}ERROR{%- endif %}
    _cis_status: >-
      {%- set out = _audit_output.stdout | default('') -%}
      {%- if '** PASS **' in out %}PASS{%- elif '** FAIL **' in out %}FAIL{%- else %}ERROR{%- endif %}

- name: "Req 2 - Store requirement 2 details"
  ansible.builtin.set_fact:
    task_02_name: "Determine compliance status from audit output"
    task_02_cmd: "set_fact"
    task_02_rc: "0"
    data_02: "Compliance: {{ compliance_status }}"
    status_02: "{{ compliance_status }}"
    details_02: "Compliance status determined from script output."

# Requirement 3: Store final audit result in cis_result
- name: "Req step-03 - Set cis_result from compliance status"
  ansible.builtin.set_fact:
    cis_result: "{{ compliance_status }}"

- name: "Req 3 - Store requirement 3 details"
  ansible.builtin.set_fact:
    task_03_name: "Store final audit result in cis_result"
    task_03_cmd: "set_fact"
    task_03_rc: "0"
    data_03: "{{ cis_result }}"
    status_03: "PASS"
    details_03: "cis_result set to {{ cis_result }}."

# Requirement 4: Generate audit report
- name: "Req 4 - Store requirement 4 details"
  ansible.builtin.set_fact:
    task_04_name: "Generate audit report"
    task_04_cmd: "debug"
    task_04_rc: "0"
    data_04: "Report generated"
    status_04: "PASS"
    details_04: "Audit report displayed"

- name: "Req 4 - Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 1.1.1.1"
    - "Reference: CIS Benchmark checkpoint 1.1.1.1"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ details_02 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not recorded') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('ERROR') | trim }}"
    - "  Details: {{ details_04 | default('') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "========================================================"
