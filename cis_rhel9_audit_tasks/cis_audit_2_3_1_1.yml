---
- name: Initialize meta data variables
  include_vars: cis_audit_var_2_3_1_1.yml

- name: "Req 1 - Read Guest account status"
  community.windows.win_security_policy:
    section: Registry Values
    key: EnableGuestAccount
  register: result_01
  failed_when: false
  changed_when: false

- name: "Req 2 - Check Guest account GPO registry value"
  ansible.windows.win_shell: |
    {% raw %}
    $ErrorActionPreference = 'Continue'
    $p = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name 'DefaultUserName' -ErrorAction SilentlyContinue
    if ($null -eq $p) {
      Write-Output 'NOT_FOUND'
      exit 0
    }
    Write-Output ($p.DefaultUserName)
    {% endraw %}
  register: result_02
  failed_when: false
  changed_when: false

- name: "Store requirement 1 and 2 details"
  set_fact:
    task_01_name: "Read Guest account status"
    task_01_cmd: "community.windows.win_security_policy section=Registry Values key=EnableGuestAccount"
    task_01_rc: "{{ result_01.rc | default(-1) }}"
    data_01: "{{ result_01.value | default('UNKNOWN') | string | trim }}"
    status_01: "{{ 'ERROR' if (result_01.value | default('') | string | trim) == '' else 'PASS' if (result_01.value | default('') | string | trim) == '0' else 'FAIL' }}"
    details_01: "Checking Accounts Guest account status"
    task_02_name: "Check Guest account GPO registry value"
    task_02_cmd: |-
      Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon' -Name 'DefaultUserName' -ErrorAction SilentlyContinue
    task_02_rc: "{{ result_02.rc | default(-1) }}"
    data_02: "{{ result_02.stdout | default('') | trim }}"
    status_02: "{{ 'ERROR' if (result_02.rc | default(-1) | int) != 0 else 'PASS' if (result_02.stdout | default('') | trim | upper) in ['NOT_FOUND', ''] else 'FAIL' if (result_02.stdout | default('') | trim | upper) == 'GUEST' else 'PASS' }}"
    details_02: "Registry DefaultUserName check"

- name: "Req 3 - Determine overall compliance status"
  set_fact:
    task_03_name: "Determine overall compliance status"
    task_03_cmd: "set_fact evaluation of status_01"
    task_03_rc: "0"
    data_03: "{{ status_01 | default('ERROR') | trim }}"
    status_03: "{{ status_01 | default('ERROR') | trim }}"
    details_03: "Overall compliance derived from Guest account status"

- name: "Req 4 - Store final audit result in cis_result"
  set_fact:
    task_04_name: "Store final audit result in cis_result"
    task_04_cmd: "set_fact cis_result = status_03"
    task_04_rc: "0"
    data_04: "{{ status_03 | default('ERROR') | trim }}"
    status_04: "{{ status_03 | default('ERROR') | trim }}"
    details_04: "cis_result set to {{ status_03 | default('ERROR') | trim }}"
    cis_result: "{{ status_03 | default('ERROR') | trim }}"

- name: "Generate audit report"
  debug:
    msg:
    - "AUDIT REPORT — CIS 2.3.1.1"
    - "Reference: CIS Benchmark checkpoint 2.3.1.1"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ details_02 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not recorded') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('ERROR') | trim }}"
    - "  Details: {{ details_04 | default('') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "========================================================"
