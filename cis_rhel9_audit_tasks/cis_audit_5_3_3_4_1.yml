---
- name: Initialize meta data variables
  include_vars: cis_audit_var_5_3_3_4_1.yml

- name: "Req 1 - Check if PAM configuration files exist"
  ansible.builtin.shell: "ls /etc/pam.d/password-auth /etc/pam.d/system-auth"
  args:
    executable: /bin/bash
  register: result_01
  failed_when: false
  changed_when: false

- name: "Store requirement 01 details"
  ansible.builtin.set_fact:
    task_01_name: "Check if PAM configuration files exist"
    task_01_cmd: "ls /etc/pam.d/password-auth /etc/pam.d/system-auth"
    task_01_rc: "{{ result_01.rc | default(-1) }}"
    data_01: "{{ result_01.stdout | default('') | trim }}"
    status_01: "{{ ('PASS' if result_01.rc | default(-1) == 0 else 'FAIL') | trim }}"
    details_01: "{{ ('Both files exist' if result_01.rc | default(-1) == 0 else 'Missing one or both PAM config files') | trim }}"

- name: "Req 2 - Check that pam_unix.so lines do not include nullok"
  ansible.builtin.shell: "{{ grep_cmd }}"
  args:
    executable: /bin/bash
  register: result_02
  failed_when: false
  changed_when: false

- name: "Store requirement 02 details"
  ansible.builtin.set_fact:
    task_02_name: "Check that pam_unix.so lines do not include nullok"
    task_02_cmd: "{{ grep_cmd }}"
    task_02_rc: "{{ result_02.rc | default(-1) }}"
    data_02: "{{ result_02.stdout | default('') | trim }}"
    status_02: "{{ ('PASS' if ('nullok' not in (result_02.stdout | default('') | trim)) else 'FAIL') | trim }}"
    details_02: "{{ ('No nullok argument found' if ('nullok' not in (result_02.stdout | default('') | trim)) else 'nullok argument detected in pam_unix.so lines') | trim }}"

- name: "Req 3 - Check overall compliance status"
  ansible.builtin.set_fact:
    status_03: >-
      {% if status_01 | trim == 'FAIL' %}SKIP
      {% elif status_02 | trim == 'FAIL' %}FAIL
      {% else %}PASS
      {% endif %}
    details_03: >-
      {% if status_01 | trim == 'FAIL' %}PAM configuration files missing - audit skipped
      {% elif status_02 | trim == 'FAIL' %}pam_unix.so lines contain nullok
      {% else %}All checks passed, no nullok found
      {% endif %}
    task_03_name: "Evaluate overall compliance"
    task_03_cmd: "N/A"
    task_03_rc: "N/A"
    data_03: "Not applicable"

- name: "Req 4 - Store the final audit result in cis_result"
  ansible.builtin.set_fact:
    cis_result: "{{ status_03 | default('ERROR') | trim }}"

- name: "Store requirement 04 details"
  ansible.builtin.set_fact:
    task_04_name: "Store final audit result"
    task_04_cmd: "set_fact"
    task_04_rc: "0"
    data_04: "{{ cis_result }}"
    status_04: "{{ ('PASS' if cis_result in ['PASS','FAIL','SKIP'] else 'ERROR') | trim }}"
    details_04: "Final result stored as cis_result"

- name: "Req 5 - Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 5.3.3.4.1"
    - "Reference: CIS Benchmark checkpoint 5.3.3.4.1"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ details_02 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not recorded') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('ERROR') | trim }}"
    - "  Details: {{ details_04 | default('') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "========================================================"
